services:
  # Dime Backend Web Service
  - type: web
    name: dime-backend-api
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dime-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dime-redis
          property: connectionString

  # Redis for Kill Switch Queue
  - type: redis
    name: dime-redis
    plan: starter
    region: oregon
    ipAllowList: []

databases:
  - name: dime-db
    databaseName: dime_db
    user: dime_admin
    plan: starter
    region: oregon

