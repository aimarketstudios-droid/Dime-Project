name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Standalone Android APK
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Prebuild Native Android Project
        run: |
          cd mobile
          npx expo prebuild --platform android --no-install

      - name: Optimize & Build Minified Production Release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          # Ensure release APK is signed and optimized
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4608m -XX:MaxMetaspaceSize=1024m"
          
          # Rename output to a user-friendly name
          mkdir -p ../../dist-apk
          cp app/build/outputs/apk/release/app-release.apk ../../dist-apk/Dime-v1.0.0.apk

      - name: Upload Optimized APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Dime Android APK v1.0.0 (Direct Install)"
          body: "Optimized, lightweight production APK for Android. Directly downloadable and installable."
          draft: false
          prerelease: false
          files: dist-apk/Dime-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
